<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<title>Paris Chantiers</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/carte.css">

<script src="js/p5.min.js"></script>
<script src="js/carte_filter.js" defer></script>
</head>

<body>

     <div id="timelineBar">
    <div class="timelineLabels">
  <span id="labelStart"></span>
  <span id="labelMiddle"></span>
  <span id="labelEnd"></span>
</div>
  <div id="timelineProgress"></div>
  <div id="timelineCursor"></div>

  </div>

  <div class="tick" style="left:20%">2020</div>
<div class="tick" style="left:50%">2024</div>
<div class="tick" style="left:80%">2027</div> 


<!-- CANVAS -->
<div id="canvas-container"></div>

<div id="topRightControls">
  <label class="collage-toggle">
    <input type="checkbox" id="collageMapMode">
    Mode collage carte
  </label>
</div>

<div id="photoPanel">

  <h2>Archives citoyennes</h2>

 <div id="collageControls">
 <div id="collageControls">
  <label>
    <input type="checkbox" value="chantier" class="collage-filter-check">
    Chantier
  </label>

  <label>
    <input type="checkbox" value="beton" class="collage-filter-check">
    Béton
  </label>

  <label>
    <input type="checkbox" value="fracture" class="collage-filter-check">
    Fracture
  </label>
</div>
</div>

  <div id="photoGallery"></div>

</div>

<div id="cartoPanel">
  
  <div class="cartoTitle">
    Archives citoyennes
  </div>

  <label class="cartoFilter">
    <input type="checkbox" id="fracture">
    Fracture
  </label>

  <label class="cartoFilter">
    <input type="checkbox" id="archive">
    Archive
  </label>

  <label class="cartoFilter">
    <input type="checkbox" id="invasion">
    Invasion
  </label>



</div>

<!-- UI -->
<div id="ui-bar">
  <button id="resetMapBtn">RETOUR</button>

  <button id="backBtn" onclick="window.location.href='index.html'">
    ACCUEIL
  </button>
</div>


<div id="ui">

  <div class="ui-title">Responsable de chantier</div>

  <label><input type="checkbox" id="paris"> Ville de Paris</label>
  <label><input type="checkbox" id="tiers"> Tiers</label>
  <label><input type="checkbox" id="reseaux"> Réseaux</label>

</div>


<!-- BACK -->


</body>
</html>
